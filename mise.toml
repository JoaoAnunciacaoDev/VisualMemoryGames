[tools]
bun = "1.3.13"
uv = "0.12.17"

[tasks."api.back"]
env = { PYTHONIOENCODING = "utf-8", PYTHONUTF8 = "1", PYTHONUNBUFFERED = "1" }
run = "uv run fastapi dev app/main.py"

[tasks.setup]
depends = ["setup.back", "setup.front"]

[tasks."api.front"]
dir = "frontend"
run = "bun run dev"

[tasks."setup.back"]
run = """
uv sync --locked --dev
uv run alembic upgrade head
"""

[tasks."setup.front"]
dir = "frontend"
run = "bun install --frozen-lockfile"

[tasks."front.lint"]
dir = "frontend"
run = "bun run lint"

[tasks."back.lint"]
dir = "app"
run = "uv run ruff check"

[tasks."back.lint.fix"]
dir = "app"
run = "uv run ruff check --fix"

[tasks."back.formatter"]
description = "Run Ruff formatter on the app/ directory"
dir="app"
run = "uv run ruff format ."

[tasks."back.test"]
dir = "app"
env = { PYTHONPATH = ".." }
run = "uv run pytest"

[tasks."front.test"]
dir = "frontend"
run = "bun run test"

[tasks."back.e2e.setup"]
env = { DATABASE_URL = "sqlite:///{{ config_root }}/visualmemory_test.db" }
run = [
  "uv run python -c \"import os; os.remove('visualmemory_test.db') if os.path.exists('visualmemory_test.db') else None\"",
  "uv run alembic upgrade head"
]

[tasks."e2e.test"]
dir = "frontend"
depends = ["back.e2e.setup"]
env = { PLAYWRIGHT_BROWSERS_PATH = "0", DATABASE_URL = "sqlite:///{{ config_root }}/visualmemory_test.db" }
run = "bun run test:e2e"

[tasks."e2e.ui"]
dir = "frontend"
depends = ["back.e2e.setup"]
env = { PLAYWRIGHT_BROWSERS_PATH = "0", DATABASE_URL = "sqlite:///{{ config_root }}/visualmemory_test.db" }
run = "bun run test:e2e:ui"
